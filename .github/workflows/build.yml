name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  # domínio público do deploy: defina em Settings > Secrets and variables > Actions > Variables (APP_DOMAIN)
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}

jobs:
  test:
    name: typecheck + testes + build (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: deploy (Swarm + Traefik)
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Opções de acesso ao repo (no servidor):
      #   A) deploy key em ~/.ssh/vault_deploy_key (recomendado; adicione a .pub
      #      em Settings > Deploy keys do repo tania_assistente), ou
      #   B) secret DEPLOY_TOKEN = PAT/classic com read no repo (clona por HTTPS).
      # DEPLOY_DIR (opcional) aponta para um clone já existente.
      - name: Build + stack deploy (Traefik)
        uses: appleboy/ssh-action@v1
        env:
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DOMAIN,DEPLOY_DIR,DEPLOY_TOKEN
          script: |
            set -e
            DIR="${DEPLOY_DIR:-$HOME/Tania_Assistente}"
            KEY="${GIT_SSH_KEY:-$HOME/.ssh/vault_deploy_key}"

            if [ -n "$DEPLOY_TOKEN" ]; then
              REPO="https://x-access-token:${DEPLOY_TOKEN}@github.com/${{ github.repository }}.git"
              echo "acesso: HTTPS + DEPLOY_TOKEN"
            else
              REPO="git@github.com:${{ github.repository }}.git"
              if [ ! -f "$KEY" ]; then
                for cand in "$HOME/.ssh/id_ed25519" "$HOME/.ssh/id_rsa"; do
                  [ -f "$cand" ] && KEY="$cand" && break
                done
              fi
              if [ -f "$KEY" ]; then
                export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
                echo "acesso: SSH + $KEY"
                echo "--- CHAVE PUBLICA (adicione em Settings > Deploy keys do repo) ---"
                cat "$KEY.pub" 2>/dev/null || ssh-keygen -y -f "$KEY" 2>/dev/null || echo "(nao consegui ler a publica)"
                echo "----------------------------------------------------------------"
              else
                echo "aviso: nenhuma chave SSH encontrada no servidor"
              fi
            fi

            if [ ! -d "$DIR/.git" ]; then
              if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
                echo "ERRO: $DIR existe e não é um clone git." >&2
                echo "Ajuste o secret DEPLOY_DIR ou mova/apague a pasta." >&2
                exit 1
              fi
              mkdir -p "$(dirname "$DIR")"
              git clone "$REPO" "$DIR" || {
                echo "ERRO: clone falhou." >&2
                echo "Adicione a chave pública do servidor como Deploy Key no repo" >&2
                echo "ou configure o secret DEPLOY_TOKEN (PAT com read)." >&2
                exit 1
              }
            fi

            cd "$DIR"
            git fetch --prune origin
            git checkout main
            git pull --ff-only

            cd app
            for f in .env agent.config.json; do
              [ -f "$f" ] || {
                echo "ERRO: falta app/$f no servidor (fora do git)." >&2
                echo "Crie o arquivo em $DIR/app e rode o workflow de novo." >&2
                exit 1
              }
            done
            docker build -t tania-app:latest .
            docker stack deploy --resolve-image never -c build.yml tania
            docker service update --force --detach tania_app >/dev/null || true
