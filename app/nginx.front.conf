# nginx.front.conf — front (app/dist) + proxy do que é dado para o backend Rust.
# Os dados (/api, /files) passam pelo login do backend. O estático também: cada página/asset
# pergunta ao backend (auth_request em /api/auth/me) e, sem sessão, vai para /login.
# Públicos: só manifest, ícones e marca (PWA), como no portão do backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Location relativo (/login): atrás do Docker/Traefik a porta e o host reais não são os do nginx
    absolute_redirect off;

    # DNS do Docker com TTL curto: o IP do backend muda quando o container reinicia,
    # e com nome fixo no proxy_pass o nginx guardaria o IP antigo para sempre (502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3100;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown;

    # sessão válida? 2xx = entra; 401 = manda para o /login do backend
    location = /_auth {
        internal;
        proxy_pass $backend/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @login {
        return 302 /login;
    }

    # PWA e marca: públicos (a tela de login e o app instalado precisam deles sem sessão)
    location = /manifest.webmanifest { }
    location ~ ^/(icons|brand)/[\w.-]+\.(png|svg)$ { }

    # assets com hash do Vite: cache longo (privado: dependem de login); index.html sempre revalida
    location /assets/ {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location = /index.html {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
    }

    # dados, login e tools (/tools/<id>/ui|api): tudo pelo backend (Rust, que repassa ao Node o que ainda não foi portado)
    location ~ ^/(api|files|tools)/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # anexos grandes e respostas longas do agente
        client_max_body_size 50m;     # mesmo limite do upload no backend
        proxy_read_timeout 300s;      # o agente LLM pode demorar
    }
    location ~ ^/(login|logout)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # rotas do SPA -> index.html
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ /index.html;
    }
}
